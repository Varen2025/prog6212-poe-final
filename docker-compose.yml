# TITLE: Quickstart: Run SQL Server container images with Docker
# AUTHOR: Microsoft
# DATE: n.d.
# AVAILABLE:
# https://learn.microsoft.com/en-us/sql/linux/quickstart-install-connect-docker
# DATE ACCESSED: 20 November 2026
#
# Usage: Referenced for running SQL Server 2022 in a container
# (ACCEPT_EULA, MSSQL_SA_PASSWORD and the sqlcmd health check).

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in your .env file}
    volumes:
      - raceday-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RaceDayDatabase: "Server=db,1433;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Database__MigrateOnStartup: "true"
      BlobStorage__ConnectionString: ${BLOB_CONNECTION_STRING:-}
      BlobStorage__ContainerName: ${BLOB_CONTAINER_NAME:-raceday-images}
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Inside this container "localhost" is the web container itself,
      # so the API is reached by its compose service name.
      RaceDayApi__BaseUrl: "http://api:8080/"
    ports:
      - "8080:8080"

volumes:
  raceday-db: